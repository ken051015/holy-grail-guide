### 1. 出生自帶魔眼 / 異能種子的真實機率
出生時系統會以 **`3%` 為基礎機率** 乘上家世倍率，決定你體內是否帶有異能種子（剛出生時為未覺醒狀態，面板不可見）：
* **退魔家門（倍率 4x）**：**`12.0%`**（唯一能抽中專屬被動**「魔之血」**的出身，且權重極高！）
* **河畔育幼院（倍率 2x）**：**`6.0%`**
* **名門長子 / 次子 / 沒落 / 教會（倍率 1.5x）**：**`4.5%`**
* **平凡家庭（倍率 1x）**：**`3.0%`**

### 2. 覺醒死線（6 ～ 18 歲）與「喪親爆種機制」
<div class="warn-box">

* **硬性年齡限制**：魔眼只能在 **`6 歲 ～ 18 歲`（且聖杯戰爭尚未爆發前）** 觸發覺醒！若跨入 19～20 歲仍未跳出覺醒事件，代表這局沒有抽中種子（或屬於約 12% 抽中種子但連續 13 年未骰過的非酋情況），想刷魔眼的玩家可在 19 歲直接重開。
* **🔥 喪親爆種機制**：6～18 歲期間，每年基礎覺醒率為 **`15%`**。**但若當年剛好發生「親人過世」事件，當年的魔眼覺醒機率會直接暴增 3 倍變為 `45%`！**

### 3. 魔眼威力公式與「30% 晉升寶石級」秘訣
魔眼分為 4 個等級（**下級 `1.0x`、中級 `2.5x`、上級 `4.0x`、寶石級 `6.0x`**）與 3 段控制度（**無法控制 `0.7x`、控制普通 `1.0x`、控制純熟 `1.3x`**）：
<div class="formula-box">魔眼最終威力倍率 = 等級倍率 × 控制度倍率 （最高為寶石級：6.0 × 1.3 = 7.8 倍！）</div>

* **控制度修煉**：覺醒後至 50 歲前，每年有 **15%** 機率觸發修煉事件。若有魔術師/師父、教會（花 5 財富）、退魔家門背景，可 **100% 安全提升 1 階控制度**；普通人選「獨自硬撐」只有 **50% 成功率**（失敗扣 5 健康）。
* **💎 晉升寶石級**：當控制度修煉到最高階（**第 2 階：控制純熟**）的那一瞬間，若魔眼尚未達到寶石級，系統會立刻進行一次 **`30%` 機率** 的判定——骰過即可直接將魔眼提升一個階級（最高直接進化為 **`寶石級魔眼`**）！

## 三、 成長與壽命機制：年度目標公式與 104 歲大限

1. **聖杯戰爭爆發年齡**：出生時即隨機決定在 **`17 歲 ～ 36 歲`** 之間的某一年爆發。
2. **年齡成長率衰減 (`youth`)**：
   * **`6 ～ 25 歲`**：屬性成長 **`× 1.2 倍`**（黃金養成期）
   * **`26 ～ 45 歲`**：`× 1.0 倍` ｜ **`46 ～ 65 歲`**：`× 0.75 倍` ｜ **`66 歲以上`**：`× 0.5 倍`
3. **修煉 (`train`) 加魔力公式**：
   <div class="formula-box">每年魔力增加 = 隨機(2~5) × 年齡倍率 × (0.6 + 迴路等級 × 0.15) × (有魔術家世或師父 ? 1.0 : 0.7)</div>
   *(⚠️ 注意：13 歲後選「修煉」，每年會固定增加 `0.15%` 的「魔術實驗事故」意外猝死率！)*
4. **自然死亡率與 `104 歲` 硬性壽命極限**：
   * 40 歲起每年扣減健康；55 歲起魔力 > 30 者每年自然流失 0～2 點魔力。
   * **健康值的長壽效應**：自然死亡率公式中含有 `exp((50 - 健康) / 16)`。將健康維持在 **100** 時，自然死亡率會縮小為 **`0.044 倍`（降低 95.6% 死亡率）**！
   * **絕對壽命大限**：程式碼中寫死 `S.age >= 104` 強制觸發往生，故人類角色的最高壽命極限為 **`104 歲`**。

## 四、 魔術與武術技能樹：硬性屬性門檻與「2 年 100% 保底升級」機制

許多玩家疑惑為何魔術卡在「入門」或「熟練」升不上去，那是因為沒達到該技能綁定的**「隱藏屬性硬門檻」**！

## 五、 聖杯戰爭戰鬥公式：五圍權重、技能疊加與 v2.03 知名度修正

### 1. 從者五圍面板的真實權重公式 (`heroBase`)
遊戲中五圍等級換算分數為：**`E=1, D=2, C=3, B=4, A=5, EX=6`**，每多一個 `+` 號額外 **`+0.4`**（因此 **`A+++ (6.2)`** 在數值上比 **`EX (6.0)`** 還高 0.2 分！）。
<div class="formula-box">基礎戰力 = [ 78 + 筋力×1.7 + (敏捷 + 耐久 + 魔力)×1.4 + 幸運×1.9 ] × (0.55 + 0.45 × 當前HP / 100)</div>

* **核心細節 1：「幸運 (`×1.9`)」是全五圍中加基礎戰力權重最高的屬性**，其次是「筋力 (`×1.7`)」！
* **核心細節 2（傷勢懲罰與令咒無視傷勢）**：從者扣血會導致基礎戰力下降（殘血時最低跌至 55%）；**但使用「令咒強化」或 Berserker「狂化爆發」的回合，會強制以 `100% 滿血` 計算最高戰力**！

### 2. 職階隱藏面板倍率 (`clsBonus` & `clsEdge`)
* **Caster（魔術師）**：常駐額外增加 **`魔力 × 1.2`** 戰鬥力！若在自家魔術工房防守且結界未破，再加 **`+12` 戰力**。
* **Assassin（刺客）**：常駐額外增加 **`敏捷 × 1.0`** 戰鬥力！主動奇襲的第 1 回合依「氣息遮斷」等級額外爆發。
* **Archer（弓兵）**：每一場戰鬥的**前 2 回合，無條件自帶「射程優勢 `+7` 戰鬥力」**！
* **🔥 魔術師型 Berserker（僅限「摩根」與「克里姆希爾德」兩人）**：隱藏被動 `MAGE_BERSERK`，常駐額外增加 **`魔力 × 2.0`** 戰鬥力（比 Caster 還高）！

### 3. 從者技能無上限疊加公式 (`SV`)
同類型的從者技能在計算時是**「全部相加」**的：
* **攻擊強化類 (`power`，如魔力放出、龍之爐心、女神神核、高速神言等)**：每回合常駐 **`+ 技能總分 × 1.2`** 戰力！
* **戰前削弱類 (`sabotage`，如破壞工作、所羅門的戒指等)**：每回合直接**扣除對手 `技能總分 × 1.1`** 戰力！
* **預知洞察類 (`insight`，如直感、千里眼、無窮的武練)**：第 2 回合起常駐 **`+ 技能總分 × 0.9`** 戰力。
  * **🌟 預知閃避寶具 (`FORESEE`)**：只要「直感 / 啟示 / 千里眼」達 **A 級以上**（如所羅門、阿爾托莉雅等），即使面對敵人第一次解放的未知寶具，也能自動預知並減免傷害！
* **神性 (`div`) / 狂化 (`mad`) / 統率 (`rally`)**：每回合常駐 **`+ 技能總分 × 0.8`** 戰力（主動進攻時，**騎乘 `ride`** 也提供 `× 0.8` 戰力）。
* **對魔力 (`mr`)**：直接削減對手寶具 **`技能總分 × 2.2`** 的威力；對戰 Caster 或魔術攻擊時每回合扣對手 **`技能總分 × 1.2`** 戰力。
* **迴避類 (`evade`，如矢避之加護、彗星跑法)**：每 1 分技能等級提供 **`3.5%` 獨立減傷/閃避率（最高封頂 `35%`）**。
* **復仇者 (`avenge`)**：每回合增加 **`(100 - 當前HP) × 0.045 × 技能總分`** 戰力（血越少越強）。

### 4. v2.03 新增：「知名度修正 (`FAME`)」與「四維情報」
* **知名度常駐戰力加成 (`fameP = 11 × (知名度分數/100)^1.5`)**：
  * **`EX` 級（共 11 人：所羅門、赫拉克勒斯、阿爾托莉雅、貞德、始皇帝、亞歷山大、拿破崙、達文西、福爾摩斯、莫札特、莎士比亞）**：無條件常駐 **`+11.00` 戰鬥力**！
  * **`A` 級（吉爾伽美什、阿基里斯、梅林、巖窟王、莉莉絲等）**：常駐 **`+7.87` 戰鬥力**。

## 六、 兩套「無敵畢業流派」養成 SOP

### 🔮 流派一：【全魔術・根源神代流】
* **首抽目標**：**名門魔術家門長子**（自帶 300 年魔術刻印）＋ **魔術迴路 A 級 (或 B 級)** ＋ 家傳主修 **【元素魔術】或【結界魔術】**。
* **3 大魔術槽配置**：
  1. 主修：**【元素魔術】(衝 Lv.4 秘傳)** —— 主力輸出與強化。
  2. 副修 1：**【占星術】(Lv.3 高位)** —— Lv.1 御主單挑 100% 看穿對手出招；Lv.2 群星預警 100% 免疫夜襲！
  3. 副修 2：**【鍊金術】(Lv.3 高位)** —— 每場戰鬥 2 次應急治癒，且 Lv.3 **免費贈送「人造人」當使魔**（不佔使魔魔術槽位即可白天偵查盯梢、偷看敵人寶具真名！）。
* **養成時間軸**：6～14 歲年度目標全選 **「學習」** 把**知識衝到 60**（解鎖占星與鍊金 Lv.3 門檻）➔ 15 歲起全程切回 **「修煉」** 把**魔力衝到 90~100**（讓從者五圍全部升一階）並灌滿技能 `xp` 觸發 2 年保底升級！

### 🥊 流派二：【全體術・魔術師殺手流（手撕從者與御主）】
* **首抽目標**：**退魔家門**（12% 機率抽中**「魔之血」**，且全武術觸發率 ×2 倍）＋ **魔術迴路 C 級**。
* **技能槽配置（2 武術 ＋ 1 魔術）**：
  1. 武術 1：**【退魔體術】(Lv.2 滿)** 或 **【八極拳】(Lv.3)** —— 解鎖遭遇暗殺時肉身反殺與單挑必殺技。
  2. 武術 2：**【槍械・近接制壓】(16 歲解鎖，Lv.3)** —— 現代槍械可用 **2 次**，無視單挑猜拳相剋，對正統魔術師擁有毀滅性特攻！
  3. 魔術槽：**【強化魔術】(Lv.3)** —— 唯一檢定「健康」的魔術！與武術連動，大幅強化御主肉搏單挑威力！
* **養成時間軸**：全程主選 **「身體」**（使武術入門率變 4 倍並穩定 +2 xp，把**健康衝到 90~100**），穿插幾年 **「心靈」** 把**精神拉到 60**。在御主決鬥或與從者死鬥（Duel）中，靠著 v2.03 新增的「施放高位秘技當回合免疫從者普攻」與雙發特攻手槍，御主本人就能正面擊潰敵方陣營！

## 七、 從者召喚與聖遺物機制：獲取途徑、滿月劫持與 全 135 從者聖遺物大辭典

### 1. 聖遺物（催化劑）的獲取規則與「戰前一年保底」
* **持有上限**：每段人生最多可同時持有 **`3 件`** 聖遺物（僅會抽出常規七職階從者的聖遺物）。
* **圖鑑未收錄加權 (`sumW`)**：只要是你的**「從者圖鑑中尚未契約過」**的從者，無論在隨機獲得聖遺物、或是不放聖遺物進行相性召喚時，其出現權重都會**自動 `× 2 倍`**！
* **5 大獲取途徑**：
  1. **魔術家門庫房發現**（限魔術師家世）。
  2. **海外留學奇遇**（曾觸發海外/時計塔留學事件）。
  3. **孤兒院身世遺物**（河畔育幼院出身且解開身世之謎，會獲得當年被遺棄時留在身邊的聖遺物）。
  4. **沒落家門戰前黑市舉債購買**（**沒落的魔術家門**專屬：若到聖杯戰爭爆發時身上 1 件聖遺物都沒有，可在開戰前夕選擇**「舉債購買催化劑（財富 -20）」**強制獲得 1 件聖遺物！）。
  5. **🔥 戰前一年強制保底事件**：在聖杯戰爭爆發的**前一年（`warAge - 1` 歲）**，只要你身上的聖遺物少於 3 件，系統必定會強制觸發一次古董店/遺物事件讓你有機會入手聖遺物！
* **⚠️ 單一聖遺物的自動放入注意**：若你沒有設定首頁的「羈絆召喚」，且身上**剛好只有 `1 件` 聖遺物**，召喚時系統不會跳出選擇視窗，而是會**自動將該聖遺物放入陣中直接召喚**！只有當持有 `2 ～ 3 件` 聖遺物（或有設定羈絆召喚）時，才會跳出選單讓你挑「放哪一件」或「什麼都不放」。

### 2. 召喚儀式的前置隱藏選項（開戰前夕）
當手背浮現令咒時，依據你的出身與經歷會解鎖特殊的開戰準備選項：
* **名門長子 / 名門次子 / 持有魔術刻印** ➔ 可選**「按家族儀式準備 3 天（財富 -6）」**：開局直接獲得**防禦結界與從者信賴度加成**！
* **聖堂教會神父家門** ➔ 可選**「先告知父親」**：獲得聖堂教會的暗中支援，戰爭期間監督官的情報會悄悄流入你手中！
* **曾出國留學 (`abroad`)** ➔ 可選**「向時計塔的師父尋求建議」**：開局直接獲得參加本次戰爭的魔術協會派系御主情報！

### 3. 召喚卡池的 4 大分支判定順序與精確機率公式

當你進入午夜召喚儀式時，系統會嚴格按照以下 **1 ➔ 2 ➔ 3 ➔ 4** 的優先順序進行判定：

#### 【第 1 順位】羈絆召喚 (`Bond Summon`)
* 若在首頁選擇了過往契約過的從者並點選「緣之召喚」，會依顯示的羈絆成功率（最高 **100% 必定成功**）進行判定。若未命中，則自動轉入下方的「無聖遺物召喚」流程。

#### 【第 2 順位】放入聖遺物召喚（含「聖遺物碎裂」強行歪出 Avenger / Ruler 機制！）
* **一般情況（復仇與正義傾向皆 `< 5`）**：放入哪一件聖遺物，就 **`100%` 必定召喚出該聖遺物對應的從者**！
* **🔥 聖遺物碎裂機制（當你的隱藏傾向 `復仇 avenger` 或 `正義 judge` 累積達 `5 點以上` 時）**：
  即使你放入了某位從者的專屬聖遺物，也有 **`pSp × 50%`（約 `15.75% ～ 30%`）** 的機率發生**「魔法陣中央的聖遺物無聲碎裂！回應你的不是遺物呼喚的英靈，而是與你相似的某種存在」**，直接無視聖遺物，強行召喚出 **Avenger（復仇者）** 或 **Ruler（裁定者）**！

#### 【第 3 順位】不放聖遺物 ➔ 「滿月之夜 BB / Alter Ego 強制劫持召喚」
* **滿月之夜機率**：每一局聖杯戰爭的召喚之夜，固定有 **`12.5% (1/8)`** 的機率出現*「那天晚上，天上升起了滿月」*。
* **BB 劫持率 (`moonHijP`)**：在**「滿月之夜」且「不放任何聖遺物」**時，會有 **`2.5%`** 的機率（若前世達成過與 BB 的「月之約定 `moonVow`」，劫持率翻倍為 **`5.0%`**）觸發滿月月光改寫魔法陣！
  * 若尚未看過「去往月亮的杯 (`moonSend`)」結局：**`100%` 強制召喚出 `Moon Cancer：BB`**！
  * 若已達成過「去往月亮的杯」結局：有 **`1/3 (33.3%)` 機率召喚出 `Alter Ego`（Meltryllis 或 Passionlip）**，**`2/3 (66.7%)` 機率召喚出 `BB`**！
  * *(💡 註：v2.03 版本起，只要達成過一次「去往月亮的杯」結局，BB 就會永久解鎖並加入首頁的「羈絆召喚」列表中！此外，當你自己擔任 BB 的御主時，戰爭第 2～8 天每天早上有 4% 機率，Meltryllis 或 Passionlip 會作為額外組別亂入戰場！)*

#### 【第 4 順位】不放聖遺物 ➔ 「特殊職階（Avenger / Ruler）亂入」或「常規相性召喚」
1. **先判定特殊職階亂入率 (`pSp`)**：
   <div class="formula-box">Avenger / Ruler 亂入率 pSp = min( 60%, 1.5% + 6% × max(復仇傾向, 正義傾向) )</div>
   * 即使你的復仇與正義傾向都是 `0`，不放聖遺物時也有 **`1.5%` 的保底機率** 直接抽中 Avenger 或 Ruler！
   * 孤兒院出身（自帶復仇 +1）或教會出身（自帶正義 +1），開局基礎亂入率即從 **`7.5%`** 起跳；傾向疊到 10 點時可達最高 **`60%`**！
   * 決定出特殊職階後，抽出 Avenger 與 Ruler 的權重比為 `(復仇傾向 + 0.5) : (正義傾向 + 0.5)`。
2. **最後進行常規七職階「相性召喚 (`affinity`)」**：
   * 若未觸發上述特殊職階，系統會計算你的性格與全體常規從者的契合度分數 `fitScore`，並按權重公式 **`權重 = exp(契合度 / 8) × 未契約過加權(2倍)`** 抽出與你靈魂波長最契合的從者！

### 4. 敵方陣營出現特殊職階（Extra Class）的機率
* 每一場聖杯戰爭開局時，另外 6 組 NPC 敵人中，固定有 **`12.0%`** 的機率會將其中一席常規職階替換為 **特殊職階（Avenger / Ruler / Alter Ego；若當天為滿月之夜，敵方特殊席位也有機率刷出野生 BB！）**。

## 八、 非同步連線「派出的組（第 8 組亂入者）」配對與戰力計算公式

當你贏得聖杯戰爭且從者存活時，可在結算畫面或往生紀錄中將隊伍派往其他玩家的聖杯戰爭（每位玩家最多可在伺服器上同時維持 **`30 組`** 現役隊伍）：
1. **時空配對規則**：你的隊伍只會出現在**「比你的戰爭年份晚 `1 ～ 40 年`、且發生在『不同城市』」**的其他玩家聖杯戰爭中（其他玩家在召喚時有 **15% 機率** 抽中第 8 組亂入）。由於大多數玩家遊玩預設的現代局（戰爭年份約落在 `1995 ～ 2035 年`），在 **`1995 ～ 2000 年`** 左右獲勝的隊伍擁有最高的配對覆蓋率。
2. **派出的御主戰力 (`pw`) 公式**（最低 58，最高封頂 **88**）：
   <div class="formula-box">派出御主戰力 pw = clamp( 58 ~ 88, 四捨五入(56 + 迴路等級×4 + 擊殺數×3 + 信賴度×0.08) )</div>
   *(只要是 A 級迴路 (5)、信賴度 100，且親手擊殺滿 2 組以上敵人，派出去的御主戰力即可達到滿值 **`88` 點**！)*
3. **派出的 AI 戰術性格 (`ghTac`)**：
   * 該場戰爭親手擊殺 **>= 3 組** ➔ 成為 **`Hunter`（主動獵殺型 AI）**，在別人世界裡每晚積極主動出擊！
   * 擊殺 < 3 組但信賴度 **>= 70** ➔ 成為 **`Defensive`（防守型 AI）**。
   * 擊殺 1 ~ 2 組且信賴度 < 70 ➔ 成為 **`Proud`（自傲型 AI）**。
4. **老手記憶壓制 (`know` / `gEdge`) 與 v2.03 魔眼繼承**：
   * 你在該場戰爭中「看穿真名 (`+5`)、看穿寶具 (`+3`)、親手擊殺 (`+2`)」過的從者會被記錄在隊伍記憶中。若其他玩家召喚出你曾殺過的從者，你的分身會說出專屬台詞並獲得最高 **`+10` 戰鬥力優勢**！
   * **v2.03 更新**：派出的御主現在會將**已覺醒的魔眼（等級 1~4 與控制度 0~2）**以及**剩餘令咒（最高支援至 9 劃）**一併帶入其他玩家的世界中！

     ⚙️ 網站核心驅動腳本：Markdown 渲染 + 自動生成 TOC 目錄 + 聖遺物搜尋 + 6國語言自動翻譯

<script>
// 1. 渲染 Markdown 並自動包裝所有表格為手機可橫向滑動的容器
(function renderApp() {
    var mdText = document.getElementById('md-source').textContent;
    var contentArea = document.getElementById('content-area');
    contentArea.innerHTML = marked.parse(mdText);

    // 為所有表格套上響應式滾動容器 .table-wrap
    contentArea.querySelectorAll('table').forEach(function(tbl) {
        var wrapper = document.createElement('div');
        wrapper.className = 'table-wrap';
        tbl.parentNode.insertBefore(wrapper, tbl);
        wrapper.appendChild(tbl);
    });

    // 自動生成左側章節導覽 (TOC)
    var tocList = document.getElementById('toc-list');
    var headings = contentArea.querySelectorAll('h2, h3');
    headings.forEach(function(h, idx) {
        var id = 'section-' + idx;
        h.id = id;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent;
        if (h.tagName === 'H3') a.className = 'toc-h3';
        a.onclick = function() {
            document.getElementById('sidebar-toc').classList.remove('mobile-open');
        };
        li.appendChild(a);
        tocList.appendChild(li);
    });
})();

// 2. 手機版目錄開關
function toggleMobileToc() {
    document.getElementById('sidebar-toc').classList.toggle('mobile-open');
}

// 3. 全 135 名從者聖遺物即時搜尋過濾器
function filterRelicTable() {
    var input = document.getElementById('relic-search');
    if (!input) return;
    var q = input.value.trim().toLowerCase();
    var box = document.getElementById('relic-table-box');
    if (!box) return;
    var rows = box.querySelectorAll('tbody tr');
    var shown = 0;
    rows.forEach(function(r) {
        var txt = r.textContent.toLowerCase();
        if (!q || txt.includes(q)) {
            r.style.display = '';
            shown++;
        } else {
            r.style.display = 'none';
        }
    });
    var cnt = document.getElementById('relic-count');
    if (cnt) cnt.textContent = '顯示 ' + shown + ' / ' + rows.length + ' 名從者';
}

// 4. 啟動 GitHub 開源 translate.js v3 智慧多語系引擎 (免跳轉、原頁無刷新翻譯 + 自動匹配系統預設語言)
function changeLanguage(langName) {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    var btn = document.getElementById('lang-' + langName);
    if (btn) btn.classList.add('active');
    if (typeof translate !== 'undefined') {
        translate.changeLanguage(langName);
    }
}

window.addEventListener('DOMContentLoaded', function() {
    if (typeof translate !== 'undefined') {
        // 設定原文為繁體中文
        translate.language.setLocal('chinese_traditional');
        // 使用高速客戶端通道 v2
        translate.service.use('client.edge');
        // 保護特定代碼與職階不被誤翻
        translate.ignore.tag.push('code');
        translate.ignore.class.push('notranslate');
        // 自動偵測使用者系統預設語言並直接切換！
        var sys = (navigator.language || navigator.userLanguage || 'zh-TW').toLowerCase();
        var defaultLang = 'chinese_traditional';
        if (sys.startsWith('zh-cn') || sys.startsWith('zh-hans') || sys === 'zh') defaultLang = 'chinese_simplified';
        else if (sys.startsWith('ko')) defaultLang = 'korean';
        else if (sys.startsWith('ja')) defaultLang = 'japanese';
        else if (sys.startsWith('ru')) defaultLang = 'russian';
        else if (sys.startsWith('en')) defaultLang = 'english';

        translate.execute();

        // 若使用者尚未手動選過語言，且系統語言非繁中，自動切換為使用者系統語言
        var savedLang = translate.language.getCurrent();
        var activeLang = savedLang || defaultLang;
        document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
        var activeBtn = document.getElementById('lang-' + activeLang);
        if (activeBtn) activeBtn.classList.add('active');
        if (!savedLang && defaultLang !== 'chinese_traditional') {
            setTimeout(function() { translate.changeLanguage(defaultLang); }, 300);
        }
    }
});
</script>
